version: '3.8'

services:
  crawl4ai-mcp:
    build: .
    image: crawl4ai-mcp:latest
    container_name: crawl4ai-mcp-server
    restart: unless-stopped
    
    # For STDIO mode (default)
    stdin_open: true
    tty: true
    
    # Environment variables
    environment:
      - CRAWL4AI_MCP_LOG_LEVEL=${CRAWL4AI_MCP_LOG_LEVEL:-}
      - PYTHONUNBUFFERED=1
      # Headless browser optimization
      - CRAWL4AI_BROWSER_TYPE=${CRAWL4AI_BROWSER_TYPE:-chromium}
      - CRAWL4AI_HEADLESS=true
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
      - DISPLAY=:99
      # Chrome-specific flags for Docker
      - CHROME_FLAGS=--no-sandbox --disable-dev-shm-usage --disable-gpu --headless
    
    # Optional: expose port for HTTP mode
    ports:
      - "8000:8000"
    
    # Optional: volume mount for persistent data
    volumes:
      - ./logs:/app/logs
      - ./cache:/app/cache
    
    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import crawl4ai_mcp.server; print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Alternative configuration for HTTP mode
  crawl4ai-mcp-http:
    build: .
    image: crawl4ai-mcp:latest
    container_name: crawl4ai-mcp-http
    restart: unless-stopped
    
    environment:
      - CRAWL4AI_MCP_LOG_LEVEL=${CRAWL4AI_MCP_LOG_LEVEL:-}
      - PYTHONUNBUFFERED=1
      # Headless browser optimization
      - CRAWL4AI_BROWSER_TYPE=${CRAWL4AI_BROWSER_TYPE:-chromium}
      - CRAWL4AI_HEADLESS=true
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
      - DISPLAY=:99
      # Chrome-specific flags for Docker
      - CHROME_FLAGS=--no-sandbox --disable-dev-shm-usage --disable-gpu --headless
    
    ports:
      - "8000:8000"
    
    volumes:
      - ./logs:/app/logs
      - ./cache:/app/cache
    
    command: ["python", "-m", "crawl4ai_mcp.server", "--transport", "http", "--host", "0.0.0.0", "--port", "8000"]
    
    profiles:
      - http
    
    # The server has no /health route. A plain GET on /mcp is answered with
    # 406 Not Acceptable (or 400) by a running server, so any HTTP status
    # below 500 counts as healthy; a refused connection or 5xx does not.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request, urllib.error
          try:
              urllib.request.urlopen("http://localhost:8000/mcp", timeout=5)
          except urllib.error.HTTPError as e:
              sys.exit(0 if e.code < 500 else 1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s